name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: extractions/setup-just@v4
      - run: pnpm install --frozen-lockfile
      - run: just lint
      - run: just typecheck
      - run: just test
      # npm retired the classic audit endpoints (410) on 2026-07-14; pnpm 10's
      # audit has no bulk-endpoint support. Run the audit via pnpm 11 until the
      # repo's standalone pnpm-11 upgrade lands (needs pnpm.overrides migration).
      - run: pnpm dlx pnpm@11 audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    # Preinstalled browsers; `playwright install` hangs reproducibly on the
    # bare runner after the chromium download completes. Tag must match the
    # @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: extractions/setup-just@v4
      - run: pnpm install --frozen-lockfile
      - run: just e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'playwright-test-secret-at-least-32-chars-long' }}
